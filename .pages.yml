media:
  input: public/images
  output: /images
  categories:
    - image

content:
  - name: pages
    label: Pages
    type: collection
    path: src/content
    format: yaml-frontmatter
    subfolders: true
    view:
      primary: title
      search: title
    fields:
      - name: title
        label: Page title
        type: string
        required: true

      - name: sections
        label: Content sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Section {index}"
        fields:
          - name: layout
            label: Layout
            type: select
            options:
              values:
                - 1-column
                - 2-columns
                - 3-columns
                - 4-columns
          - name: variant
            label: Variant
            type: select
            options:
              values:
                - none
                - card
          - name: blocks
            label: Blocks
            type: block
            list:
              collapsible:
                collapsed: true
                summary: "Block {index}"
            blockKey: type
            blocks: &primitive_blocks
              - name: text
                label: Text
                fields:
                  - name: text
                    label: Text
                    type: rich-text
              - name: image
                label: Image
                fields:
                  - name: image
                    label: Image
                    type: object
                    fields:
                      - name: src
                        label: Image
                        type: image
                      - name: alt
                        label: Alt text
                        type: string
                      - name: size
                        label: Size
                        type: select
                        options:
                          values:
                            - small
                            - medium
                            - large
                            - full
                      - name: crop
                        label: Crop
                        type: select
                        options:
                          values:
                            - landscape
                            - square
                            - portrait
                            - natural
              - name: gallery
                label: Gallery
                fields:
                  - name: gallery
                    label: Gallery
                    type: object
                    fields:
                      - name: images
                        label: Gallery images
                        type: object
                        list: true
                        fields:
                          - name: src
                            label: Image
                            type: image
                          - name: alt
                            label: Alt text
                            type: string
                      - name: controls
                        label: Show controls
                        type: boolean
                      - name: autoscroll
                        label: Autoscroll
                        type: boolean
                      - name: interval
                        label: Autoscroll interval
                        type: number
                      - name: navigation
                        label: Navigation
                        type: select
                        options:
                          values:
                            - thumbnails
                            - dots
                            - none
                      - name: size
                        label: Size
                        type: select
                        options:
                          values:
                            - small
                            - medium
                            - large
                            - full
                      - name: crop
                        label: Crop
                        type: select
                        options:
                          values:
                            - landscape
                            - square
                            - portrait
                            - natural
              - name: button
                label: Button
                fields:
                  - name: button
                    label: Button
                    type: object
                    fields:
                      - name: label
                        label: Label
                        type: string
                      - name: href
                        label: Link
                        type: string
                      - name: variant
                        label: Variant
                        type: select
                        options:
                          values:
                            - primary
                            - secondary
                            - tertiary
                            - text
                      - name: external
                        label: Open externally
                        type: boolean

              - name: blocks
                label: Content container
                fields:
                  - name: layout
                    label: Layout
                    type: select
                    options:
                      values:
                        - 1-column
                        - 2-columns
                        - 3-columns
                        - 4-columns
                  - name: variant
                    label: Variant
                    type: select
                    options:
                      values:
                        - none
                        - card
                  - name: blocks
                    label: Blocks
                    type: block
                    list: true
                    blockKey: type
                    blocks: *primitive_blocks
